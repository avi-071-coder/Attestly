# ATTESTLY — Full Stack Docker Compose
# Brings up all infrastructure with a single command

version: "3.9"

services:
  # ─── Frontend (Next.js) ────────────────────────
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

  # ─── Backend (FastAPI) ─────────────────────────
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://attestly:attestly@postgres:5432/attestly
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      - model_cache:/app/hf_cache
      - uploads:/app/uploads
      - trained_models:/app/trained_models

  # ─── Celery Worker ─────────────────────────────
  celery-worker:
    build: ./backend
    command: celery -A app.workers.finetune_worker worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://attestly:attestly@postgres:5432/attestly
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      - redis
      - postgres
    volumes:
      - model_cache:/app/hf_cache
      - uploads:/app/uploads
      - trained_models:/app/trained_models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ─── PostgreSQL ────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: attestly
      POSTGRES_USER: attestly
      POSTGRES_PASSWORD: attestly
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # ─── Redis ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # ─── MinIO (S3-compatible Object Storage) ──────
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  # ─── Ollama (Model Serving) ────────────────────
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  pgdata:
  minio_data:
  ollama_data:
  model_cache:
  uploads:
  trained_models:
